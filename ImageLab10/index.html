<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-sky src="assets/pinksky-edit.jpg"></a-sky>

      <a-box src="assets/sand.jpg" position="-4 0.5 -3" rotation="0 45 0" ></a-box>
      <a-sphere src="assets/ballcolor.jpg" position="5.5 1.25 -5" radius="1.25" ></a-sphere>
      <!-- <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder> -->
      

           <!-- Ground -->
      <a-plane src="assets/sand.jpg" position="0 0 -5" rotation="-90 0 0" width="20" height="20"></a-plane>

      <!-- Main wall (front) -->
      <a-box src="assets/sand.jpg" position="-1.5 0.25 -4" width="1" height="0.5" depth="0.5"></a-box>
      <a-box src="assets/sand.jpg" position="-0.5 0.25 -4" width="1" height="0.5" depth="0.5"></a-box>
      <a-box src="assets/sand.jpg" position="0.5  0.25 -4" width="1" height="0.5" depth="0.5"></a-box>
      <a-box src="assets/sand.jpg" position="1.5  0.25 -4" width="1" height="0.5" depth="0.5"></a-box>

      <!-- Main wall (back) -->
      <a-box src="assets/sand.jpg" position="-1.5 0.25 -6" width="1" height="0.5" depth="0.5"></a-box>
      <a-box src="assets/sand.jpg" position="-0.5 0.25 -6" width="1" height="0.5" depth="0.5"></a-box>
      <a-box src="assets/sand.jpg" position="0.5  0.25 -6" width="1" height="0.5" depth="0.5"></a-box>
      <a-box src="assets/sand.jpg" position="1.5  0.25 -6" width="1" height="0.5" depth="0.5"></a-box>

      <!-- Side walls -->
      <a-box src="assets/sand.jpg" position="-2 0.25 -5" width="0.5" height="0.5" depth="1.5"></a-box>
      <a-box src="assets/sand.jpg" position="2  0.25 -5" width="0.5" height="0.5" depth="1.5"></a-box>

      <!-- Corner towers - bottom -->
      <a-cylinder src="assets/sand.jpg" position="-2 0.5 -4" radius="0.4" height="1"></a-cylinder>
      <a-cylinder src="assets/sand.jpg" position=" 2 0.5 -4" radius="0.4" height="1"></a-cylinder>
      <a-cylinder src="assets/sand.jpg" position="-2 0.5 -6" radius="0.4" height="1"></a-cylinder>
      <a-cylinder src="assets/sand.jpg" position=" 2 0.5 -6" radius="0.4" height="1"></a-cylinder>

      <!-- Corner towers - top (battlements) -->
      <a-box src="assets/sand.jpg" position="-2.2 1.1 -4"   width="0.3" height="0.3" depth="0.3"></a-box>
      <a-box src="assets/sand.jpg" position="-1.8 1.1 -4"   width="0.3" height="0.3" depth="0.3"></a-box>
      <a-box src="assets/sand.jpg" position=" 1.8 1.1 -4"   width="0.3" height="0.3" depth="0.3"></a-box>
      <a-box src="assets/sand.jpg" position=" 2.2 1.1 -4"   width="0.3" height="0.3" depth="0.3"></a-box>
      <a-box src="assets/sand.jpg" position="-2.2 1.1 -6"   width="0.3" height="0.3" depth="0.3"></a-box>
      <a-box src="assets/sand.jpg" position="-1.8 1.1 -6"   width="0.3" height="0.3" depth="0.3"></a-box>
      <a-box src="assets/sand.jpg" position=" 1.8 1.1 -6"   width="0.3" height="0.3" depth="0.3"></a-box>
      <a-box src="assets/sand.jpg" position=" 2.2 1.1 -6"   width="0.3" height="0.3" depth="0.3"></a-box>

      <!-- Center keep (tall tower) -->
      <a-cylinder src="assets/sand.jpg" position="0 1 -5" radius="0.6" height="2"></a-cylinder>
      <!-- Keep battlements -->
      <a-box src="assets/sand.jpg" position="-0.4 2.15 -5" width="0.25" height="0.3" depth="0.25"></a-box>
      <a-box src="assets/sand.jpg" position=" 0.4 2.15 -5" width="0.25" height="0.3" depth="0.25"></a-box>
      <a-box src="assets/sand.jpg" position="0   2.15 -4.6" width="0.25" height="0.3" depth="0.25"></a-box>
      <a-box src="assets/sand.jpg" position="0   2.15 -5.4" width="0.25" height="0.3" depth="0.25"></a-box>

      <!-- Gate (archway gap in front wall) -->
      <a-box src="assets/sand.jpg" position="0 0.5 -4" width="0.6" height="0.6" depth="0.6" color="#c2a06e"></a-box>
    </a-scene>
  </body>
</html>
